# P3 parity fixture — mean_reversion is on the active v2 roster but has no
# config under configs/backtest/. Params mirror the donchian baseline where
# they overlap (risk 0.5%, no scale-out, no trailing) so the run exercises the
# MR entry + bracket exit path deterministically. Absolute performance is
# irrelevant here: parity only needs before == after.
strategy: mean_reversion
instrument_symbol: XAUUSD
bar_type_suffix: 5-MINUTE-LAST-EXTERNAL
venue:
  name: SIM
  starting_balance: "100000"
  currency: USD
  commission_per_lot_usd: "0"
  oms_type: HEDGING
strategy_params:
  bb_period: 20
  rsi_period: 14
  sl_atr_mult: "1.0"
  tp_atr_mult: "2.0"
  risk_percent: "0.5"
  scale_out_enabled: false
  trailing_enabled: false
data:
  kind: parquet
  path: data/historical/XAUUSD/M5/in_sample.parquet
