# P3 parity fixture — the GATED Supertrend path.
#
# Supertrend is the one strategy that runs its session gate BEFORE the entry
# model's state upkeep (an out-of-session bar must not consume the flip, so an
# overnight flip still enters on the first eligible bar). That ordering is
# deliberate and differs from Donchian / mean-reversion, so it needs a fixture
# that actually exercises it. The ADX gate is on as well: it is the one gate
# that sits AFTER evaluate().
#
# A fixture, not a result.
strategy: supertrend
instrument_symbol: XAUUSD
bar_type_suffix: 5-MINUTE-LAST-EXTERNAL
venue:
  name: SIM
  starting_balance: "100000"
  currency: USD
  commission_per_lot_usd: "0"
  oms_type: HEDGING
strategy_params:
  period: 10
  multiplier: 3.0
  atr_period: 14
  sl_atr_mult: "2.0"
  tp_atr_mult: "4.0"
  risk_percent: "0.5"
  scale_out_enabled: false
  trailing_enabled: false
  adx_gate_min: "20"
  adx_gate_period: 14
  session_filter_tz: America/New_York
  session_filter_open_hour: 7
  session_filter_close_hour: 16
  session_filter_exit_policy: flatten
data:
  kind: parquet
  path: data/historical/XAUUSD/M5/in_sample.parquet
