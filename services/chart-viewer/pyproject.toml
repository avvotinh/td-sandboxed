[project]
name = "chart-viewer"
version = "0.1.0"
description = "Local FastAPI viewer for Result Contract v2 backtest runs (lightweight-charts)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Sandboxed Team"}
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas>=2.2",
    "pyarrow>=15.0",
]

[project.scripts]
chart-viewer = "chart_viewer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chart_viewer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
