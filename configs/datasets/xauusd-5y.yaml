# Epic 16 — XAUUSD 5-year multi-timeframe acquisition dataset.
# Loaded by src.backtesting.dataset.spec.DatasetSpec.from_yaml; consumed
# by DatasetPipeline → backtest validation (Epic 15) + meta-label / signal
# -quality training (future epic).
#
# DEPTH IS A TARGET, NOT A GUARANTEE (epic-16-context.md Decision 2):
# TradingView caps ~5500 bars/anchor and has a finite intraday history
# floor. M5 will likely under-cover the 5y in_sample window (realistic
# ~2-3y); H1/H4 reach 5y comfortably. Story 16.5 records the ACTUAL depth
# achieved per timeframe; the in_sample window may be reconciled to that
# depth in a single deliberate dataset_version bump after the fetch.
#
# Bumping dataset_version (or any window boundary) invalidates every
# downstream comparison report. Do it deliberately.

name: xauusd-5y
description: >-
  XAUUSD M5/M15/H1/H4 5-year acquisition dataset for Epic 15 backtest
  validation and future ML training. Premium ReplayMode fetch.
dataset_version: "1.0.0"

symbol: XAUUSD
timeframes:
  - M5
  - M15
  - H1
  - H4

# Weekend/holiday closure runs ~51-52h on OANDA H4 (empirical, 16.4 smoke
# 2026-05-24: 260 weekend gaps, median 52h, max 76h on the Christmas/NY
# stretch). A 48h threshold flagged every normal weekend as noise; 72h
# ignores weekends while still surfacing genuine extended outages and the
# leading shortfall left when a finer timeframe hits the history floor.
max_gap_hours: 72.0

windows:
  - name: in_sample
    kind: in_sample
    start: 2021-01-01T00:00:00Z
    end: 2026-01-01T00:00:00Z
  - name: oos_reserve
    kind: oos_reserve
    start: 2026-01-01T00:00:00Z
    end: 2026-05-01T00:00:00Z
